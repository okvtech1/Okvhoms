<!doctype html>
<html lang="en">
<head><script>(function(){function chain(){var f=function(){return chain();};return new Proxy(f,{get:function(t,n){if(n==='then')return undefined;return chain();},apply:function(){return chain();}});}window.google={script:{run:chain()}};})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OKV Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link href="vendor/bootstrap.min.css" rel="stylesheet">
<link href="vendor/bootstrap-icons.min.css" rel="stylesheet">
<style>
:root{--ink:#0e2a2b;--ink2:#14393b;--paper:#f4f7f6;--brass:#c8962e;--line:#d9e3e1;--mut:#566b6a;--bs-body-font-family:'Public Sans',system-ui,sans-serif;--bs-body-bg:#f4f7f6}
h1,h2,h3,h4,.brandf{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;letter-spacing:-.01em}
.btn-brass{background:var(--brass);border-color:var(--brass);color:var(--ink);font-weight:600}.btn-brass:hover{background:#aa7c1e;border-color:#aa7c1e;color:#fff}
.side{background:var(--ink);color:#cfe0de;min-height:100vh;width:236px;position:fixed;top:0;left:0;bottom:0;overflow-y:auto;z-index:1040}
.side a.nav-link{color:#cfe0de;border-radius:8px;padding:.55rem .8rem;display:flex;gap:.65rem;align-items:center;cursor:pointer}.side a.nav-link:hover{background:rgba(255,255,255,.08)}
.side a.nav-link.active{background:rgba(200,150,46,.2);color:#fff}.side .bdg{margin-left:auto}
.main{margin-left:236px}.topbar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1030}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:center;height:100%}
.kpi .ic{width:44px;height:44px;border-radius:12px;background:rgba(200,150,46,.15);color:#8a6410;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex:none}
.kpi small{color:var(--mut);display:block;font-size:.78rem}.kpi b{font-size:1.4rem;line-height:1.1;display:block}
.cardx{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;height:100%}
.hb{margin:8px 0}.hb .t{height:8px;border-radius:5px;background:#e6eeec;overflow:hidden}.hb .t i{display:block;height:100%;background:var(--ink2)}
.tbl-wrap{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:auto}.tbl-wrap table{margin:0;white-space:nowrap}.tbl-wrap th{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);background:#f7faf9}
.act .btn{padding:.15rem .45rem;margin-left:2px}
.pill{border-radius:20px;padding:.1rem .6rem;font-size:.75rem;font-weight:600;background:#e9eeec;color:#44585a}.pill.ok{background:#dcf3e7;color:#17753f}.pill.warn{background:#fdf0cf;color:#8a6410}.pill.bad{background:#fbe0dc;color:#a3321f}.pill.info{background:#dfeaf9;color:#1c5d99}
.unread{background:#fff8e6}
.donut{width:120px;height:120px;border-radius:50%;position:relative;flex:none}.donut:after{content:'';position:absolute;inset:24px;background:#fff;border-radius:50%}
#login{min-height:100vh;background:linear-gradient(135deg,#0e2a2b,#1b4a4d)}
.scrim{display:none}
@media(max-width:991px){.side{transform:translateX(-100%);transition:transform .2s}.side.open{transform:none}.main{margin-left:0}.scrim.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1035}}
@media(max-width:575px){.kpi{padding:10px}.kpi b{font-size:1.1rem}.kpi .ic{width:36px;height:36px}}
</style>
</head>
<body>
<div id="login" class="d-flex align-items-center justify-content-center p-3">
  <div class="bg-white rounded-4 p-4 shadow" style="width:100%;max-width:380px">
    <h1 class="fs-3 mb-1">OKV Admin</h1><p class="text-secondary">Sign in to manage the website, payments and activation codes.</p>
    <form id="loginForm" onsubmit="return doLogin(event)">
      <label class="form-label" for="lu">Username</label><input class="form-control mb-3" id="lu" value="owner" autocomplete="username">
      <label class="form-label" for="lp">Password</label><input class="form-control mb-3" id="lp" type="password" autocomplete="current-password">
      <div class="alert alert-danger py-2 d-none" id="lerr" role="alert"></div>
      <button class="btn btn-brass w-100" id="lbtn" type="submit">Sign in</button>
    </form>
  </div>
</div>

<div id="app" class="d-none">
  <aside class="side p-3" id="side">
    <div class="d-flex align-items-center gap-2 mb-3"><span class="rounded-3 d-inline-flex align-items-center justify-content-center" style="width:36px;height:36px;background:#c8962e;color:#0e2a2b"><i class="bi bi-key-fill"></i></span><span class="brandf text-white fs-5">OKV Admin</span></div>
    <nav class="nav flex-column gap-1" id="nav"></nav>
    <div class="mt-4 pt-3 border-top border-secondary small"><div id="who" class="mb-2"></div><button class="btn btn-sm btn-outline-light" onclick="logout()"><i class="bi bi-box-arrow-right me-1"></i>Sign out</button></div>
  </aside>
  <div class="scrim" id="scrim" onclick="toggleSide(false)"></div>
  <div class="main">
    <div class="topbar px-3 py-2 d-flex align-items-center gap-2">
      <button class="btn btn-outline-secondary d-lg-none" onclick="toggleSide()" aria-label="Menu"><i class="bi bi-list"></i></button>
      <h2 class="fs-5 mb-0" id="ptitle">Overview</h2><span class="flex-grow-1"></span>
      <span class="small text-secondary d-none d-sm-inline" id="quota"></span>
      <button class="btn btn-outline-secondary position-relative" onclick="go('alerts')" aria-label="Alerts"><i class="bi bi-bell"></i><span class="badge text-bg-danger position-absolute top-0 start-100 translate-middle d-none" id="abadge"></span></button>
      <button class="btn btn-outline-secondary" onclick="refreshPage()" aria-label="Refresh"><i class="bi bi-arrow-clockwise"></i></button>
    </div>
    <div class="p-3 p-lg-4" id="view"></div>
  </div>
</div>

<div class="modal fade" id="m" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-scrollable modal-lg"><div class="modal-content">
  <div class="modal-header"><h3 class="modal-title fs-5" id="mt"></h3><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
  <div class="modal-body" id="mb"></div><div class="modal-footer" id="mf"></div></div></div></div>
<div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:2000"><div id="toast" class="toast align-items-center border-0" role="status"><div class="d-flex"><div class="toast-body" id="tmsg"></div><button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button></div></div></div>

<script src="vendor/bootstrap.bundle.min.js"></script>
<script>
const LINKS = {"home":"https://script.google.com/macros/s/AKfycbxhmWXrAt8I6OpqdaoaiQuqMCTZXgvxj0czeQPWdbZE6AKXTspJu_fNmLiFtvgkE3fE/exec","pricing":"https://script.google.com/macros/s/AKfycbxhmWXrAt8I6OpqdaoaiQuqMCTZXgvxj0czeQPWdbZE6AKXTspJu_fNmLiFtvgkE3fE/exec?page=pricing","demo":"https://script.google.com/macros/s/AKfycbxhmWXrAt8I6OpqdaoaiQuqMCTZXgvxj0czeQPWdbZE6AKXTspJu_fNmLiFtvgkE3fE/exec?page=demo","admin":"https://script.google.com/macros/s/AKfycbxhmWXrAt8I6OpqdaoaiQuqMCTZXgvxj0czeQPWdbZE6AKXTspJu_fNmLiFtvgkE3fE/exec?page=admin","base":"https://script.google.com/macros/s/AKfycbxhmWXrAt8I6OpqdaoaiQuqMCTZXgvxj0czeQPWdbZE6AKXTspJu_fNmLiFtvgkE3fE/exec","privacy":"https://script.google.com/macros/s/AKfycbxhmWXrAt8I6OpqdaoaiQuqMCTZXgvxj0czeQPWdbZE6AKXTspJu_fNmLiFtvgkE3fE/exec?page=privacy","terms":"https://script.google.com/macros/s/AKfycbxhmWXrAt8I6OpqdaoaiQuqMCTZXgvxj0czeQPWdbZE6AKXTspJu_fNmLiFtvgkE3fE/exec?page=terms","cookies":"https://script.google.com/macros/s/AKfycbxhmWXrAt8I6OpqdaoaiQuqMCTZXgvxj0czeQPWdbZE6AKXTspJu_fNmLiFtvgkE3fE/exec?page=cookies","refund":"https://script.google.com/macros/s/AKfycbxhmWXrAt8I6OpqdaoaiQuqMCTZXgvxj0czeQPWdbZE6AKXTspJu_fNmLiFtvgkE3fE/exec?page=refund","licence":"https://script.google.com/macros/s/AKfycbxhmWXrAt8I6OpqdaoaiQuqMCTZXgvxj0czeQPWdbZE6AKXTspJu_fNmLiFtvgkE3fE/exec?page=licence","disclaimer":"https://script.google.com/macros/s/AKfycbxhmWXrAt8I6OpqdaoaiQuqMCTZXgvxj0czeQPWdbZE6AKXTspJu_fNmLiFtvgkE3fE/exec?page=disclaimer"};
let SES = { token: null, role: null, user: null, name: null }, CUR = 'overview', DATA = {}, TBL = {}, LASTUNREAD = null, POLL = null;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (n) => (DATA.cur || '\u20a6') + Number(n || 0).toLocaleString('en-US');
function call(fn, ...a) { return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler((e) => rej(new Error((e && e.message) || String(e))))[fn](...a)); }
function auth(fn, ...a) { return call(fn, SES.token, ...a).catch((e) => { if (/session ended/i.test(e.message)) { logout(true); } throw e; }); }
function toast(m, bad) { const t = $('#toast'); t.className = 'toast align-items-center border-0 text-bg-' + (bad ? 'danger' : 'dark'); $('#tmsg').textContent = m; bootstrap.Toast.getOrCreateInstance(t, { delay: bad ? 6000 : 2800 }).show(); }
async function run(fn, okMsg) { try { const r = await fn(); if (okMsg) toast(okMsg); return r; } catch (e) { toast(e.message, true); throw e; } }
function modal(title, body, buttons) {
  $('#mt').textContent = title; $('#mb').innerHTML = body;
  $('#mf').innerHTML = (buttons || [{ label: 'Close', cls: 'btn-outline-secondary', close: 1 }]).map((b, i) => '<button class="btn ' + (b.cls || 'btn-brass') + '" data-i="' + i + '"' + (b.close ? ' data-bs-dismiss="modal"' : '') + '>' + b.label + '</button>').join('');
  (buttons || []).forEach((b, i) => { if (b.fn) $('#mf [data-i="' + i + '"]').onclick = async () => { const btn = $('#mf [data-i="' + i + '"]'); btn.disabled = true; try { const r = await b.fn(); if (r !== false) bootstrap.Modal.getOrCreateInstance($('#m')).hide(); } catch (e) { toast(e.message, true); } btn.disabled = false; }; });
  bootstrap.Modal.getOrCreateInstance($('#m')).show();
}
const closeModal = () => bootstrap.Modal.getOrCreateInstance($('#m')).hide();
const val = (id) => document.getElementById(id).value;
function toggleSide(f) { const s = $('#side'), on = f === undefined ? !s.classList.contains('open') : f; s.classList.toggle('open', on); $('#scrim').classList.toggle('on', on); }

/* ---------------- sign in ---------------- */
async function doLogin(ev) {
  ev.preventDefault(); const b = $('#lbtn'); b.disabled = true; $('#lerr').classList.add('d-none');
  try { const r = await call('adminLogin', val('lu'), val('lp')); SES = { token: r.token, role: r.role, user: r.username, name: r.name }; $('#login').classList.add('d-none'); $('#app').classList.remove('d-none'); buildNav(); go('overview'); if (r.defaultPassword) { toast('Please change your first password in Settings, My account.', true); } POLL = setInterval(pollBadges, 60000); }
  catch (e) { $('#lerr').textContent = e.message; $('#lerr').classList.remove('d-none'); }
  b.disabled = false; return false;
}
function logout(expired) { clearInterval(POLL); if (SES.token) call('adminLogout', SES.token).catch(() => {}); SES = { token: null }; $('#app').classList.add('d-none'); $('#login').classList.remove('d-none'); $('#lp').value = ''; if (expired) { $('#lerr').textContent = 'Your session ended. Please sign in again.'; $('#lerr').classList.remove('d-none'); } }

/* ---------------- navigation ---------------- */
const NAVS = [['overview', 'Overview', 'speedometer2'], ['alerts', 'Alerts', 'bell'], ['trials', 'Trial downloads', 'download'], ['requests', 'Activation requests', 'patch-check'], ['payments', 'Payments', 'credit-card'], ['codes', 'Activation codes', 'key'], ['customers', 'Customers', 'people'], ['compose', 'Send messages', 'send'], ['inbox', 'Inbox', 'inbox'], ['installs', 'Installations', 'tools'], ['tools', 'Support tools', 'life-preserver'], ['log', 'Message log', 'journal-text'], ['settings', 'Settings', 'gear', 1]];
function buildNav() { $('#nav').innerHTML = NAVS.filter((n) => !n[3] || SES.role === 'owner').map((n) => '<a class="nav-link" data-id="' + n[0] + '" onclick="go(\'' + n[0] + '\')"><i class="bi bi-' + n[2] + '"></i><span>' + n[1] + '</span><span class="badge text-bg-warning bdg d-none" id="b_' + n[0] + '"></span></a>').join(''); $('#who').innerHTML = '<b class="text-white">' + esc(SES.name) + '</b><br>' + (SES.role === 'owner' ? 'Owner (super admin)' : 'Support'); }
async function go(id) {
  CUR = id; toggleSide(false); document.querySelectorAll('#nav a').forEach((a) => a.classList.toggle('active', a.dataset.id === id));
  const n = NAVS.find((x) => x[0] === id); $('#ptitle').textContent = n ? n[1] : id; $('#view').innerHTML = '<div class="text-center py-5"><div class="spinner-border text-secondary"></div></div>';
  try { await PAGE[id](); } catch (e) { $('#view').innerHTML = '<div class="alert alert-danger">' + esc(e.message) + '</div>'; }
}
const refreshPage = () => go(CUR);
async function pollBadges() { try { const o = await auth('adminOverview'); setBadges(o); if (LASTUNREAD !== null && o.unread > LASTUNREAD) toast('New alert received'); LASTUNREAD = o.unread; } catch (e) { /* ignore */ } }
function setBadges(o) {
  DATA.cur = o.currency; LASTUNREAD = o.unread; const set = (id, n) => { const b = $('#b_' + id); if (b) { b.textContent = n; b.classList.toggle('d-none', !n); } };
  set('alerts', o.unread); set('requests', o.pending); set('inbox', o.counts.inboxNew); set('installs', o.installPending);
  const ab = $('#abadge'); ab.textContent = o.unread; ab.classList.toggle('d-none', !o.unread); $('#quota').textContent = 'Emails left today: ' + o.quota;
}

/* ---------------- small building blocks ---------------- */
const kpi = (ic, l, v, s) => '<div class="col-6 col-md-4 col-xl-3"><div class="kpi"><div class="ic"><i class="bi bi-' + ic + '"></i></div><div><small>' + esc(l) + '</small><b>' + v + '</b>' + (s ? '<small>' + esc(s) + '</small>' : '') + '</div></div></div>';
function hbars(items, fmt) { const max = Math.max(1, ...items.map((i) => i.v)); return items.length ? items.map((i) => '<div class="hb"><div class="d-flex justify-content-between small"><span>' + esc(i.l) + '</span><b>' + (fmt ? fmt(i.v) : i.v) + '</b></div><div class="t"><i style="width:' + Math.round(i.v * 100 / max) + '%"></i></div></div>').join('') : '<p class="text-secondary small mb-0">Nothing yet.</p>'; }
function stacked(series, keys, colors, labels) {
  const W = 560, H = 170, pad = 12, n = series.length, bw = (W - pad * 2) / n, max = Math.max(1, ...series.map((s) => keys.reduce((a, k) => a + s[k], 0))); let g = '';
  series.forEach((s, i) => { let y = H - 22; keys.forEach((k, j) => { const h = (H - 44) * s[k] / max; y -= h; if (s[k]) g += '<rect x="' + (pad + i * bw + 3) + '" y="' + y + '" width="' + (bw - 6) + '" height="' + h + '" fill="' + colors[j] + '"><title>' + labels[j] + ' ' + s[k] + '</title></rect>'; }); if (i % 2 === 0) g += '<text x="' + (pad + i * bw + bw / 2) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="10" fill="#566b6a">' + s.date.slice(8) + '/' + s.date.slice(5, 7) + '</text>'; });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img">' + g + '</svg><div class="small d-flex gap-3 flex-wrap">' + keys.map((k, j) => '<span><i class="bi bi-square-fill" style="color:' + colors[j] + '"></i> ' + labels[j] + '</span>').join('') + '</div>';
}
function donut(items, colors) { const tot = items.reduce((a, i) => a + i.v, 0); if (!tot) return '<p class="text-secondary small mb-0">Nothing yet.</p>'; let acc = 0; const segs = items.map((i, k) => { const a = acc / tot * 100; acc += i.v; return colors[k % colors.length] + ' ' + a + '% ' + acc / tot * 100 + '%'; }); return '<div class="d-flex gap-3 align-items-center"><div class="donut" style="background:conic-gradient(' + segs.join(',') + ')"></div><div class="small">' + items.map((i, k) => '<div><i class="bi bi-square-fill" style="color:' + colors[k % colors.length] + '"></i> ' + esc(i.l) + ': <b>' + i.v + '</b></div>').join('') + '</div></div>'; }
const statusPill = (s) => { const m = { Pending: 'warn', Approved: 'ok', Rejected: 'bad', Active: 'ok', 'Code sent': 'info', 'Payment sent': 'warn', Processed: 'ok', Initiated: 'info', Failed: 'bad', 'Amount mismatch': 'bad', Requested: 'warn', Scheduled: 'info', Done: 'ok', Cancelled: 'bad', New: 'warn', Handled: 'ok', available: 'ok', sent: 'info', used: 'warn', void: 'bad' }; return '<span class="pill ' + (m[s] || '') + '">' + esc(s) + '</span>'; };
const ib = (icon, tip, fnCall, cls) => '<button class="btn btn-sm btn-outline-' + (cls || 'secondary') + '" title="' + esc(tip) + '" aria-label="' + esc(tip) + '" onclick="' + fnCall + '"><i class="bi bi-' + icon + '"></i></button>';

/* generic table with search and paging */
function table(id, cols, rows, o) {
  o = o || {}; TBL[id] = { cols: cols, rows: rows, q: '', page: 0, size: o.size || 25, actions: o.actions, key: o.key, filter: o.filter };
  return '<div class="d-flex flex-wrap gap-2 mb-2 align-items-center"><input class="form-control" style="max-width:280px" placeholder="Search" oninput="TBL[\'' + id + '\'].q=this.value;TBL[\'' + id + '\'].page=0;drawTable(\'' + id + '\')" aria-label="Search">' + (o.toolbar || '') + '<span class="ms-auto small text-secondary" id="' + id + '_n"></span></div><div id="' + id + '"></div>';
}
function drawTable(id) {
  const t = TBL[id], q = t.q.toLowerCase(), all = t.rows.filter((r) => (!t.filter || t.filter(r)) && (!q || JSON.stringify(r).toLowerCase().includes(q))), pages = Math.max(1, Math.ceil(all.length / t.size)); if (t.page >= pages) t.page = pages - 1;
  const part = all.slice(t.page * t.size, (t.page + 1) * t.size);
  $('#' + id).innerHTML = '<div class="tbl-wrap"><table class="table table-hover align-middle"><thead><tr>' + t.cols.map((c) => '<th>' + esc(c.l) + '</th>').join('') + (t.actions ? '<th class="text-end">Actions</th>' : '') + '</tr></thead><tbody>' + (part.map((r) => '<tr' + (r._cls ? ' class="' + r._cls + '"' : '') + '>' + t.cols.map((c) => '<td>' + (c.f ? c.f(r) : esc(r[c.k])) + '</td>').join('') + (t.actions ? '<td class="text-end act">' + t.actions(r) + '</td>' : '') + '</tr>').join('') || '<tr><td colspan="' + (t.cols.length + 1) + '" class="text-secondary">Nothing to show.</td></tr>') + '</tbody></table></div>' + (pages > 1 ? '<div class="d-flex justify-content-between align-items-center mt-2"><button class="btn btn-sm btn-outline-secondary" ' + (t.page ? '' : 'disabled') + ' onclick="TBL[\'' + id + '\'].page--;drawTable(\'' + id + '\')">Previous</button><span class="small">Page ' + (t.page + 1) + ' of ' + pages + '</span><button class="btn btn-sm btn-outline-secondary" ' + (t.page < pages - 1 ? '' : 'disabled') + ' onclick="TBL[\'' + id + '\'].page++;drawTable(\'' + id + '\')">Next</button></div>' : '');
  const n = $('#' + id + '_n'); if (n) n.textContent = all.length + ' record' + (all.length === 1 ? '' : 's');
}
function csvOf(name, cols, rows) { const q = (v) => { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }; const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + [cols.map((c) => c.l)].concat(rows.map((r) => cols.map((c) => r[c.k]))).map((r) => r.map(q).join(',')).join('\r\n')], { type: 'text/csv' })); a.download = name + '.csv'; document.body.appendChild(a); a.click(); a.remove(); }
const exportBtn = (id, name) => '<button class="btn btn-outline-secondary" onclick="csvOf(\'' + name + '\',TBL[\'' + id + '\'].cols.filter(c=>c.k),TBL[\'' + id + '\'].rows)"><i class="bi bi-filetype-csv me-1"></i>Export</button>';
const waLink = (phone, msg) => { let n = String(phone || '').replace(/[^\d+]/g, ''); n = n[0] === '+' ? n.slice(1) : n.indexOf('00') === 0 ? n.slice(2) : n[0] === '0' ? '234' + n.slice(1) : n; return 'https://wa.me/' + n + '?text=' + encodeURIComponent(msg || ''); };

/* ---------------- contact a customer: email, WhatsApp, SMS, call ---------------- */
function contactModal(name, email, phone, hotel) {
  const w = waLink(phone, 'Hello ' + (name || '') + ', this is OKV Technology Consults.'), sms = 'sms:' + (phone || '') + '?body=' + encodeURIComponent('Hello ' + (name || '') + ', this is OKV Technology Consults.');
  modal('Contact ' + (name || email), '<p class="text-secondary">' + esc(hotel || '') + ' ' + esc(email || '') + ' ' + esc(phone || '') + '</p><div class="d-grid gap-2">' +
    (email ? '<button class="btn btn-brass" onclick="closeModal();composeTo([{name:\'' + esc(name).replace(/'/g, '') + '\',email:\'' + esc(email) + '\',phone:\'' + esc(phone) + '\',hotel:\'' + esc(hotel).replace(/'/g, '') + '\'}])"><i class="bi bi-envelope me-2"></i>Send an email from here</button>' : '') +
    (phone ? '<a class="btn btn-outline-success" target="_blank" rel="noopener" href="' + w + '"><i class="bi bi-whatsapp me-2"></i>Open WhatsApp</a><a class="btn btn-outline-secondary" href="' + sms + '"><i class="bi bi-chat-text me-2"></i>Send an SMS</a><a class="btn btn-outline-secondary" href="tel:' + esc(phone) + '"><i class="bi bi-telephone me-2"></i>Call</a>' : '') + '</div>');
}
function composeTo(list) { DATA.preRecipients = list; go('compose'); }

/* ---------------- pages ---------------- */
const PAGE = {
  async overview() {

/* ---------------- actions ---------------- */
async function markAllRead() { await run(() => auth('adminAlertsRead', 'all'), 'All alerts marked as read'); go('alerts'); }
async function markRead(id) { await run(() => auth('adminAlertsRead', [id])); go('alerts'); }
function openAlert(t) { go({ trial: 'trials', activation: 'requests', sla: 'requests', payment: 'payments', activated: 'codes', message: 'inbox', install: 'installs', warn: 'overview' }[t] || 'overview'); }
function delRow(sheet, col, key) { modal('Delete this record?', '<p>This removes it from the Google Sheet and cannot be undone.</p>', [{ label: 'Cancel', cls: 'btn-outline-secondary', close: 1 }, { label: 'Delete', cls: 'btn-danger', fn: async () => { await auth('adminDelete', sheet, col, key); toast('Deleted'); refreshPage(); } }]); }
function rowFor(tableId, col, key) { return TBL[tableId].rows.find((r) => String(r[col]) === String(key)); }
function contactRow(tableId, col, key) { const r = rowFor(tableId, col, key); contactModal(r.Name, r.Email, r.Phone, r.Hotel); }
function approve(ref) { const r = DATA.acts.find((x) => x.Ref === ref); modal('Approve ' + ref + '?', '<p>This takes the next activation code and <b>emails it straight away</b> to <b>' + esc(r.Email) + '</b>.</p><p class="text-secondary small">Amount paid: ' + money(r.Amount) + '. Check the receipt first (receipt icon).</p>', [{ label: 'Cancel', cls: 'btn-outline-secondary', close: 1 }, { label: 'Approve and send code', fn: async () => { const x = await auth('adminApprove', ref); toast('Code ' + x.code + ' sent to ' + x.email); refreshPage(); } }]); }
function reject(ref) { modal('Reject ' + ref, '<label class="form-label">Reason (the customer sees this)</label><textarea class="form-control" id="rj" rows="3">We could not confirm the payment.</textarea>', [{ label: 'Cancel', cls: 'btn-outline-secondary', close: 1 }, { label: 'Reject and email', cls: 'btn-danger', fn: async () => { await auth('adminReject', ref, val('rj')); toast('Customer told'); refreshPage(); } }]); }
async function resend(ref) { await run(() => auth('adminResendCode', ref), 'Code emailed again'); }
function sendCodeModal(code) { modal('Send an activation code', '<p class="text-secondary small">The code is emailed immediately.' + (code ? ' Code: <code>' + esc(code) + '</code>' : ' The next available code is used.') + '</p><div class="row g-2"><div class="col-md-6"><label class="form-label">Name</label><input class="form-control" id="sc_n"></div><div class="col-md-6"><label class="form-label">Email</label><input class="form-control" id="sc_e" type="email"></div><div class="col-12"><label class="form-label">Hotel (optional)</label><input class="form-control" id="sc_h"></div></div>', [{ label: 'Cancel', cls: 'btn-outline-secondary', close: 1 }, { label: 'Send code', fn: async () => { const r = await auth('adminSendCode', { name: val('sc_n'), email: val('sc_e'), hotel: val('sc_h'), code: code || '' }); toast('Sent ' + r.code); if (CUR === 'codes') refreshPage(); } }]); }
function genCodes() { modal('Generate more codes', '<label class="form-label">How many? (up to 2000)</label><input class="form-control" id="gc_n" type="number" value="500" min="1" max="2000">', [{ label: 'Cancel', cls: 'btn-outline-secondary', close: 1 }, { label: 'Generate', fn: async () => { const r = await auth('adminGenerateCodes', Number(val('gc_n'))); toast(r.created + ' codes created'); refreshPage(); } }]); }
async function codeAct(code, a) { if (!confirm(a === 'void' ? 'Cancel this code? It can no longer be used.' : 'Release this code so it can be activated on a new computer?')) return; await run(() => auth('adminCodeAction', code, a), 'Done'); refreshPage(); }

async function sendMessages() {
  const ch = document.querySelector('input[name=c_ch]:checked').value, list = recipients(); if (!list.length) return toast('Choose at least one recipient', true);

async function clearSecret(k) { if (!confirm('Remove this saved key?')) return; const o = {}; o[k] = '__clear__'; await run(() => auth('adminSecretSave', o), 'Removed'); await go('settings'); }
async function testInteg(w, arg) { try { const r = await auth('adminIntegrationTest', w, arg); toast(r.message); } catch (e) { toast(e.message, true); } }
function staffForm(u) { const r = u ? DATA.staff.find((x) => x.Username === u) : { Role: 'support', Active: '1' }; modal(u ? 'Edit ' + u : 'Add OKV staff', '<div class="row g-2"><div class="col-md-6"><label class="form-label">Username</label><input class="form-control" id="st_u" value="' + esc(r.Username) + '" ' + (u ? 'readonly' : '') + '></div><div class="col-md-6"><label class="form-label">Full name</label><input class="form-control" id="st_n" value="' + esc(r.Name) + '"></div><div class="col-md-6"><label class="form-label">Role</label><select class="form-select" id="st_r"><option value="support" ' + (r.Role === 'support' ? 'selected' : '') + '>Support</option><option value="owner" ' + (r.Role === 'owner' ? 'selected' : '') + '>Owner (super admin)</option></select></div>' + (u ? '' : '<div class="col-md-6"><label class="form-label">Password (blank = make one)</label><input class="form-control" id="st_p" type="text" autocomplete="off"></div>') + '</div>', [{ label: 'Cancel', cls: 'btn-outline-secondary', close: 1 }, { label: 'Save', fn: async () => { const x = await auth('adminStaffSave', { username: val('st_u'), name: val('st_n'), role: val('st_r'), active: r.Active, password: u ? '' : val('st_p') }); if (x.password) { modal('Account created', '<p>Give this password to <b>' + esc(val('st_u')) + '</b>. It is shown only now.</p><div class="alert alert-success fs-4 text-center">' + esc(x.password) + '</div>'); } toast('Saved'); setTab('staff'); return !x.password; } }]); }
async function staffReset(u) { if (!confirm('Reset the password for ' + u + '?')) return; const r = await run(() => auth('adminStaffReset', u)); modal('Password reset', '<p>New password for <b>' + esc(u) + '</b>. It is shown only now.</p><div class="alert alert-success fs-4 text-center">' + esc(r.password) + '</div>'); }
async function staffSuspend(u, on) { const r = DATA.staff.find((x) => x.Username === u); await run(() => auth('adminStaffSave', { username: u, name: r.Name, role: r.Role, active: on }), on ? 'Reactivated' : 'Suspended'); setTab('staff'); }
async function staffDelete(u) { if (!confirm('Delete ' + u + ' permanently?')) return; await run(() => auth('adminStaffDelete', u), 'Deleted'); setTab('staff'); }
async function changePw() { await run(() => auth('adminChangePassword', val('pw_o'), val('pw_n')), 'Password changed'); $('#pw_o').value = ''; $('#pw_n').value = ''; }
</script>
</body>
</html>
